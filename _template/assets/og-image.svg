<!-- Placeholder OG/Twitter card image (1200x630 viewBox). SVG has inconsistent
     crawler support for social-card previews -- consider exporting a real
     version as a PNG at the same dimensions once you have your own content. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="ogTitle">
  <title id="ogTitle">Your Paper Title</title>
  <rect width="1200" height="630" fill="#F5F0E6"/>
  <rect x="0" y="0" width="1200" height="10" fill="#328132"/>
  <text x="80" y="260" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#2A2521">Your Paper Title</text>
  <text x="80" y="330" font-family="system-ui, sans-serif" font-size="24" fill="#256025">Author One, Author Two</text>
  <text x="80" y="560" font-family="system-ui, sans-serif" font-size="20" fill="#6E6759">Your Institution</text>
</svg>
