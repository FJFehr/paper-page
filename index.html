<!-- ============================================================
     THEME BOOTSTRAP -- applies a default palette + light/dark mode
     before first paint (no flash of unstyled content). render.js
     re-applies the *configured* palette once project.yaml loads -- a
     brief palette swap is possible, not a layout flash. See
     tasks/02-engine-shell.md's accepted tradeoff (build.py, deferred,
     will remove this by inlining the configured palette statically).
     ============================================================ -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var mode = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", mode);
      if (typeof applyTheme === "function") applyTheme({ palette: "sage", overrides: {} }, mode);
    } catch (e) {
      /* localStorage/matchMedia unavailable -- default light stylesheet applies. */
    }
  })();
</script>
